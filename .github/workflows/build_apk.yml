name: Build and Release Android App

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  BASE_VERSION: '1.0.0'

jobs:
  android-release-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Update Version and Set Output
        id: version
        run: |
          NEW_VERSION_NAME="${{ env.BASE_VERSION }}"
          NEW_VERSION_CODE="${{ github.run_number }}"
          FULL_VERSION="${NEW_VERSION_NAME}+${NEW_VERSION_CODE}"
          
          echo "Updating pubspec.yaml version to $FULL_VERSION"
          sed -i "s/^version: .*/version: $FULL_VERSION/" pubspec.yaml
          
          # Pass the version to GitHub Actions output for the release job
          echo "version-number=$FULL_VERSION" >> $GITHUB_OUTPUT

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name=$BASE_VERSION \
            --build-number=${{ github.run_number }}

      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --build-name=$BASE_VERSION \
            --build-number=${{ github.run_number }}

      - name: Archive APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Archive AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ android-release-build ]
    permissions:
      contents: write # Required to create releases and upload assets
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk

      - name: Download AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-aab

      # 2. Extract version again for this job
      - name: Get Version Info
        id: version
        run: |
          PUB_VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}')
          FULL_VERSION="${PUB_VERSION}+${{ github.run_number }}"
          echo "version-number=$FULL_VERSION" >> $GITHUB_OUTPUT

      # 3. Create Release with Dynamic Tag
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Use the unique version (e.g., 1.0.0+123) as the tag
          tag_name: v${{ steps.version.outputs.version-number }}
          # Use the version as the title
          name: Release ${{ steps.version.outputs.version-number }}
          draft: false
          prerelease: false
          files: |
            *.apk
            *.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}